<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cyber Login</title>

<style>
/* =============== 赛博朋克背景 =============== */
html, body {
  margin: 0;
  height: 100%;
  font-family: "Segoe UI", sans-serif;
  overflow: hidden;
  background: #0a0a0f;
  color: #fff;
}

/* 粒子星空背景 */
canvas#bg {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}

/* 赛博网格 */
.cyber-grid {
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
      to right,
      rgba(120, 0, 255, 0.1) 0px,
      rgba(120, 0, 255, 0.1) 1px,
      transparent 1px,
      transparent 80px
    ),
    repeating-linear-gradient(
      to bottom,
      rgba(120, 0, 255, 0.1) 0px,
      rgba(120, 0, 255, 0.1) 1px,
      transparent 1px,
      transparent 80px
    );
  z-index: -1;
  animation: gridmove 12s linear infinite;
}
@keyframes gridmove {
  from { transform: translateY(0); }
  to   { transform: translateY(80px); }
}

/* =============== 整体容器（3D 翻转） =============== */
.container {
  width: 360px;
  height: 420px;
  margin: 120px auto;
  perspective: 1000px;
}

.card {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: 1s;
}

.card.flip {
  transform: rotateY(180deg);
}

/* 两面 */
.page {
  position: absolute;
  inset: 0;
  background: rgba(20, 20, 35, 0.75);
  border: 1px solid rgba(120, 0, 255, 0.6);
  border-radius: 20px;
  box-shadow: 0 0 25px rgba(120, 0, 255, 0.5);
  backdrop-filter: blur(8px);
  padding: 30px;
  backface-visibility: hidden;
}

.page h2 {
  text-align: center;
  font-size: 26px;
  margin-bottom: 20px;
  text-shadow: 0 0 10px #a020f0;
}

/* 输入框 */
input {
  width: 100%;
  padding: 12px;
  margin: 10px 0 20px;
  background: #0e0e18;
  border: 1px solid rgba(155, 0, 255, 0.7);
  border-radius: 8px;
  color: #fff;
  outline: none;
  font-size: 16px;
  transition: 0.3s;
}
input:focus {
  box-shadow: 0 0 12px rgba(155, 0, 255, 0.8);
}

/* 按钮（霓虹紫发光） */
button {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #a020f0, #4e0fff);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 17px;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(160, 32, 240, 0.7);
  transition: 0.3s;
}
button:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 30px rgba(200, 0, 255, 1);
}

.switch {
  text-align: center;
  margin-top: 20px;
  cursor: pointer;
  color: #a050ff;
}
.switch:hover {
  text-shadow: 0 0 10px #a050ff;
}

/* 注册页翻转 */
.register {
  transform: rotateY(180deg);
}

.success-box {
  position: fixed;
  top: 30px;
  right: 20px;
  background: rgba(50,50,70,.8);
  padding: 10px 20px;
  border-radius: 10px;
  border: 1px solid #6f00ff;
  box-shadow: 0 0 15px #6f00ff;
}
</style>
</head>

<body>
<canvas id="bg"></canvas>
<div class="cyber-grid"></div>

<div class="container">
  <div class="card" id="card">

    <!-- 登录 -->
    <div class="page login">
      <h2>Login</h2>
      <input id="l_user" placeholder="Username" />
      <input id="l_pass" type="password" placeholder="Password" />
      <button onclick="login()">LOGIN</button>
      <div class="switch" onclick="flip()">No account? Register →</div>
    </div>

    <!-- 注册 -->
    <div class="page register">
      <h2>Register</h2>
      <input id="r_user" placeholder="Username" />
      <input id="r_pass" type="password" placeholder="Password" />
      <button onclick="registerUser()">REGISTER</button>
      <div class="switch" onclick="flip()">← Back to Login</div>
    </div>

  </div>
</div>

<!-- =============== 粒子流星效果 =============== -->
<script>
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
let w, h, particles;

function init() {
  w = canvas.width = innerWidth;
  h = canvas.height = innerHeight;
  particles = Array.from({ length: 120 }, () => ({
    x: Math.random() * w,
    y: Math.random() * h,
    speed: Math.random() * 2 + 1,
    size: Math.random() * 2 + 1,
  }));
}

function draw() {
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "rgba(160, 32, 240, 0.8)";
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    p.y += p.speed;
    if (p.y > h) p.y = -5;
  });
  requestAnimationFrame(draw);
}
init();
draw();
onresize = init;
</script>

<!-- =============== 登录 / 注册 逻辑 =============== -->
<script>
const API_REGISTER = "https://你的LAF云函数地址/register";
const API_LOGIN = "https://你的LAF云函数地址/login";

function flip() {
  document.getElementById("card").classList.toggle("flip");
}

function toast(msg) {
  const box = document.createElement("div");
  box.className = "success-box";
  box.innerText = msg;
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 2000);
}

// 注册
async function registerUser() {
  const username = document.getElementById("r_user").value;
  const password = document.getElementById("r_pass").value;

  const res = await fetch(API_REGISTER, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password })
  }).then(r => r.json());

  toast(res.msg);
  if (res.code === 0) flip();
}

// 登录
async function login() {
  const username = document.getElementById("l_user").value;
  const password = document.getElementById("l_pass").value;

  const res = await fetch(API_LOGIN, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password })
  }).then(r => r.json());

  toast(res.msg);
  if (res.code === 0) {
    setTimeout(() => {
      window.location.href = "home.html"; // 登录成功跳转页面
    }, 800);
  }
}
</script>

</body>
</html>
