<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Login & Register</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Arial", sans-serif;
    }

    body {
      background: linear-gradient(145deg, #6a95ff, #9ec9ff);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 350px;
      padding: 30px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .tabs {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .tab {
      width: 50%;
      text-align: center;
      padding: 10px 0;
      cursor: pointer;
      font-size: 18px;
      border-bottom: 3px solid transparent;
      transition: 0.3s;
    }

    .active {
      border-bottom: 3px solid #6a95ff;
      font-weight: bold;
      color: #6a95ff;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #6a95ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #517dff;
    }

    #msg {
      margin-top: 10px;
      text-align: center;
      color: #ff4b4b;
      min-height: 20px;
      font-size: 14px;
    }

    .hidden { display: none; }
  </style>
</head>

<body>
  <div class="container">

    <div class="tabs">
      <div id="tab-login" class="tab active" onclick="switchTab('login')">登录</div>
      <div id="tab-register" class="tab" onclick="switchTab('register')">注册</div>
    </div>

    <!-- 登录 -->
    <div id="login-box">
      <input id="loginName" placeholder="用户名">
      <input id="loginPwd" type="password" placeholder="密码">
      <button onclick="login()">登录</button>
    </div>

    <!-- 注册 -->
    <div id="reg-box" class="hidden">
      <input id="regName" placeholder="用户名">
      <input id="regPwd" type="password" placeholder="密码">
      <button onclick="register()">注册</button>
    </div>

    <p id="msg"></p>
  </div>

  <script>
    const REGISTER_API = "https://c4ggspjp2w.hzh.sealos.run/add_user";
    const LOGIN_API = "https://c4ggspjp2w.hzh.sealos.run/login";

    function switchTab(type) {
      document.getElementById("tab-login").classList.remove("active");
      document.getElementById("tab-register").classList.remove("active");
      document.getElementById("login-box").classList.add("hidden");
      document.getElementById("reg-box").classList.add("hidden");

      if (type === "login") {
        document.getElementById("tab-login").classList.add("active");
        document.getElementById("login-box").classList.remove("hidden");
      } else {
        document.getElementById("tab-register").classList.add("active");
        document.getElementById("reg-box").classList.remove("hidden");
      }
    }

    // 注册
    async function register() {
      const username = document.getElementById("regName").value.trim();
      const password = document.getElementById("regPwd").value.trim();
      const msg = document.getElementById("msg");

      if (!username || !password) {
        msg.innerText = "请输入完整信息";
        return;
      }

      const res = await fetch(REGISTER_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (data.code === 0) msg.innerText = "注册成功！去登录 →";
      else if (data.code === 1) msg.innerText = "用户名已存在";
      else msg.innerText = "注册失败：" + data.msg;
    }

    // 登录
    async function login() {
      const username = document.getElementById("loginName").value.trim();
      const password = document.getElementById("loginPwd").value.trim();
      const msg = document.getElementById("msg");

      if (!username || !password) {
        msg.innerText = "请输入用户名和密码";
        return;
      }

      const res = await fetch(LOGIN_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (data.code === 0) {
        localStorage.setItem("user", JSON.stringify(data.user));
        window.location.href = "login_home.html";
      } else if (data.code === 1) msg.innerText = "用户不存在";
      else if (data.code === 2) msg.innerText = "密码错误";
      else msg.innerText = "登录失败：" + data.msg;
    }
  </script>
</body>
</html>
