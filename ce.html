<!DOCTYPE html>
<html>
<head>
    <title>拍照上传示例</title>
    <style>
        #camera-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #preview {
            border: 1px solid #ccc;
            max-width: 100%;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="camera-container">
        <video id="video" width="640" height="480" autoplay></video>
        <canvas id="canvas" class="hidden"></canvas>
        <img id="preview" alt="照片预览">
        
        <div>
            <button id="start">打开摄像头</button>
            <button id="capture" disabled>拍照</button>
            <button id="upload" disabled>上传</button>
        </div>
        <div id="result"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const preview = document.getElementById('preview');
        const startBtn = document.getElementById('start');
        const captureBtn = document.getElementById('capture');
        const uploadBtn = document.getElementById('upload');
        const resultDiv = document.getElementById('result');

        let mediaStream = null;
        let capturedImage = null;

        // 打开摄像头
        startBtn.addEventListener('click', async () => {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = mediaStream;
                captureBtn.disabled = false;
                startBtn.disabled = true;
            } catch (err) {
                resultDiv.textContent = '无法访问摄像头: ' + err.message;
            }
        });

        // 拍照
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            capturedImage = canvas.toDataURL('image/jpeg');
            preview.src = capturedImage;
            uploadBtn.disabled = false;
        });

        // 上传图片
        uploadBtn.addEventListener('click', async () => {
            if (!capturedImage) return;

            try {
                // 转换为Blob对象
                const blob = await fetch(capturedImage).then(res => res.blob());
                
                // 创建FormData
                const formData = new FormData();
                formData.append('photo', blob, 'photo.jpg');

                // 发送到服务器（需要替换为你的上传地址）
                const response = await fetch('https://s8u1ihmke1.bja.sealos.run/get-cemera', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                resultDiv.textContent = '上传成功: ' + JSON.stringify(result);
            } catch (err) {
                resultDiv.textContent = '上传失败: ' + err.message;
            }
        });

        // 关闭摄像头（可选）
        window.addEventListener('beforeunload', () => {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
